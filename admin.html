<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - KARI GARAGE</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
        /* Gaya tambahan khusus admin */
        
        .admin-container {
            max-width: 900px;
            margin: 100px auto 40px;
            padding: 0 20px;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 16px;
            margin-bottom: 30px;
        }
        
        .admin-header h1 {
            font-family: "Playfair Display", serif;
            font-size: 28px;
            color: #d4af37;
        }
        
        .admin-header a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .admin-header a:hover {
            color: #d4af37;
        }
        
        .admin-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s;
        }
        
        .admin-item:hover {
            border-color: rgba(212, 175, 55, 0.2);
        }
        
        .admin-item .car-name {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }
        
        .admin-item .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .status-ready {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
        }
        
        .status-rented {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }
        
        .admin-item .toggle-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            background: #d4af37;
            color: #0a0a0a;
        }
        
        .admin-item .toggle-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.2);
        }
        
        .admin-item .toggle-btn.set-rented {
            background: #ff6b6b;
            color: #fff;
        }
        
        .admin-item .toggle-btn.set-ready {
            background: #2ed573;
            color: #fff;
        }
        
        .admin-footer {
            margin-top: 40px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <!-- Header mini -->
    <header class="header scrolled" style="position:fixed; background:rgba(10,10,10,0.9); backdrop-filter:blur(12px); border-bottom:1px solid rgba(212,175,55,0.1);">
        <div class="container">
            <div class="logo">
                <div class="logo-wrapper">
                    <div class="logo-circle">
                        <img src="image/logo.jpeg" alt="KARI GARAGE" class="logo-img" />
                    </div>
                    <div class="logo-text">
                        KARI <span>GARAGE</span>
                        <small>Admin Panel</small>
                    </div>
                </div>
            </div>
            <a href="index.html" style="color:#d4af37; font-weight:500; text-decoration:none;">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-cog"></i> Manajemen Armada</h1>
            <span style="color:#888; font-size:14px;">Ubah status ketersediaan mobil</span>
        </div>

        <div class="admin-list" id="adminCarList">
            <!-- Akan diisi oleh JavaScript -->
        </div>

        <div class="admin-footer">
            <p>Data disimpan di localStorage browser. <br> Perubahan hanya berlaku di perangkat ini.</p>
        </div>
    </div>

    <!-- Script admin -->
    <script src="js/admin.js"></script>
</body>

</html>
